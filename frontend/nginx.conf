server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The JS bundle and the API's thread previews are both bulky and highly
    # compressible; gzip_proxied is what makes this apply to /api responses too.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Triage fans out across every selected project; 30s was tight enough
        # that a cold cache could return a bare 504.
        proxy_read_timeout 60s;
    }

    location /assets/ {
        # Vite emits content-hashed filenames, so these can never go stale.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
